app = 'quest-tqgcig'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DATABASE_URL = 'file:/data/quest.db'
  APP_URL = 'https://quest-tqgcig.fly.dev'
  GOOGLE_REDIRECT_URI = 'https://quest-tqgcig.fly.dev/api/google/callback'

# Disco persistente para SQLite: sobrevive a despliegues y reinicios.
[mounts]
  source = 'quest_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
