# fly.toml app configuration file generated for quest-0lyzga on 2026-10-19T22:47:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quest-0lyzga'
primary_region = 'ams'

[build]

[env]
  APP_URL = 'https://quest-tqgcig.fly.dev'
  DATABASE_URL = 'file:/data/quest.db'
  GOOGLE_REDIRECT_URI = 'https://quest-tqgcig.fly.dev/api/google/callback'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'quest_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
